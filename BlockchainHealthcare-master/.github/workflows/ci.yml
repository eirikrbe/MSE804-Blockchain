name: ci

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  chaincode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-fabric/chaincode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: healthcare-fabric/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm test

  composer-network:
    # Hyperledger Composer 0.20 only runs on Node 8; run it in a container
    # (actions cannot execute inside the old node:8 image itself).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          docker run --rm -v "$PWD/healthcare-network":/app -w /app node:8
          sh -c "npm ci && npm test"
